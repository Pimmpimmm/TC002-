name: "🧪 Portable macOS build"

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: portability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-clone-macos:
    name: "Fresh clone / macOS 14"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: bash ci/verify-portability.sh
